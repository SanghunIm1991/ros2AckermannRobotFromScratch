<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 530" width="1230" height="530" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="sim.launch.py が起動するものと、データの流れ。xacro が展開した台車の模型（ackermann_car.urdf.xacro と ackermann_car.gazebo.xacro）の URDF の文字列を、robot_state_publisher が受け取り、/robot_description で配る。ros_gz_sim create は、それを読んで、Gazebo に台車を出す（Gazebo の形式の SDF に変換される）。Gazebo の中の台車のプラグインは関節の状態を /joint_states に出し、Gazebo は時刻を /clock に出して、ros_gz_bridge が ROS 2 へ中継する。robot_state_publisher は、/joint_states と /clock から、各リンクの位置を /tf と /tf_static に送り、T2 の tf2_echo で見る。T2 の ros2 topic pub は、舵の角度と後輪の速さの4つの指令（/front_left_steer_cmd 等）を送り、ros_gz_bridge が Gazebo へ中継する。T2 の ros2 topic echo は /joint_states を見る">
<title>sim.launch.py が起動するものと、データの流れ。xacro が展開した台車の模型（ackermann_car.urdf.xacro と ackermann_car.gazebo.xacro）の URDF の文字列を、robot_state_publisher が受け取り、/robot_description で配る。ros_gz_sim create は、それを読んで、Gazebo に台車を出す（Gazebo の形式の SDF に変換される）。Gazebo の中の台車のプラグインは関節の状態を /joint_states に出し、Gazebo は時刻を /clock に出して、ros_gz_bridge が ROS 2 へ中継する。robot_state_publisher は、/joint_states と /clock から、各リンクの位置を /tf と /tf_static に送り、T2 の tf2_echo で見る。T2 の ros2 topic pub は、舵の角度と後輪の速さの4つの指令（/front_left_steer_cmd 等）を送り、ros_gz_bridge が Gazebo へ中継する。T2 の ros2 topic echo は /joint_states を見る</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs>
