<text x="155" y="59" text-anchor="middle" font-weight="bold">ackermann_car.urdf.xacro</text>
<text x="155" y="79" text-anchor="middle">＋ ackermann_car.gazebo.xacro</text>
<text x="155" y="99" text-anchor="middle">台車の模型（自分で書く）</text>
<text x="615" y="59" text-anchor="middle" font-weight="bold">robot_state_publisher</text>
<text x="615" y="79" text-anchor="middle">関節の角度から</text>
<text x="615" y="99" text-anchor="middle">各リンクの位置を計算する</text>
<text x="1075" y="59" text-anchor="middle" font-weight="bold">tf2_echo（T2）</text>
<text x="1075" y="79" text-anchor="middle">2つのフレームの間の</text>
<text x="1075" y="99" text-anchor="middle">位置と向きを表示する</text>
<text x="155" y="249" text-anchor="middle" font-weight="bold">ros_gz_sim create</text>
<text x="155" y="269" text-anchor="middle">台車の模型を読み、</text>
<text x="155" y="289" text-anchor="middle">Gazebo に台車を出す</text>
<text x="155" y="439" text-anchor="middle" font-weight="bold">Gazebo</text>
<text x="155" y="459" text-anchor="middle">台車の物理の計算と、</text>
<text x="155" y="479" text-anchor="middle">関節を動かすプラグイン</text>
<text x="615" y="439" text-anchor="middle" font-weight="bold">ros_gz_bridge</text>
<text x="615" y="459" text-anchor="middle">Gazebo と ROS 2 の間で</text>
<text x="615" y="479" text-anchor="middle">トピックを中継する</text>
<text x="1075" y="439" text-anchor="middle" font-weight="bold">ros2 topic pub・echo（T2）</text>
<text x="1075" y="459" text-anchor="middle">指令を送り、</text>
<text x="1075" y="479" text-anchor="middle">関節の状態を見る</text>
<text x="385" y="67" text-anchor="middle" font-size="13">URDF の文字列</text>
<text x="845" y="67" text-anchor="middle" font-size="13">/tf・/tf_static</text>
<text x="532" y="170" text-anchor="end" font-size="13">/robot_description</text>
<text x="163" y="365" text-anchor="start" font-size="13">台車の模型（SDF に変換）</text>
<text x="385" y="427" text-anchor="middle" font-size="13">/joint_states・/clock</text>
<text x="385" y="500" text-anchor="middle" font-size="13">4つの指令（_cmd）</text>
<text x="845" y="427" text-anchor="middle" font-size="13">/joint_states</text>
<text x="845" y="500" text-anchor="middle" font-size="13">4つの指令（_cmd）</text>
<text x="682" y="380" text-anchor="end" font-size="13">/joint_states・/clock</text>
