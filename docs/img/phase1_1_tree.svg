<text x="615" y="89" text-anchor="middle">地面の上の、base_link の真下の点</text>
<text x="615" y="239" text-anchor="middle" font-weight="bold">base_link</text>
<text x="615" y="259" text-anchor="middle">台車の基準。原点は後車軸の中心（地面から 0.04 m 上）</text>
