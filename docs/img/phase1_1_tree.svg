<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390 660" width="1390" height="660" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="台車のリンクと関節の木（TF の木）。根は地面の上の base_footprint で、固定の関節 base_joint で、後車軸の中心にある base_link（z が 0.04 m 上）につながる。base_link には、舵を切る関節（revolute）で front_left_steer_link（x 0.20・y 0.08）と front_right_steer_link（x 0.20・y −0.08）が、回る関節（continuous）で rear_left_wheel（x 0・y 0.08）と rear_right_wheel（x 0・y −0.08）がつながる。2つの舵の部品には、回る関節（continuous）で front_left_wheel と front_right_wheel がつながる。位置は、親のリンクから見た関節の位置">
<title>台車のリンクと関節の木（TF の木）。根は地面の上の base_footprint で、固定の関節 base_joint で、後車軸の中心にある base_link（z が 0.04 m 上）につながる。base_link には、舵を切る関節（revolute）で front_left_steer_link（x 0.20・y 0.08）と front_right_steer_link（x 0.20・y −0.08）が、回る関節（continuous）で rear_left_wheel（x 0・y 0.08）と rear_right_wheel（x 0・y −0.08）がつながる。2つの舵の部品には、回る関節（continuous）で front_left_wheel と front_right_wheel がつながる。位置は、親のリンクから見た関節の位置</title>
