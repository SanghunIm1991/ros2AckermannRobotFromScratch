<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 360" width="1140" height="360" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="display.launch.py が起動するノードと、データの流れ。xacro が ackermann_car.urdf.xacro を展開した URDF の文字列を、robot_state_publisher がパラメータとして受け取る。robot_state_publisher は、/robot_description で URDF を配り、joint_state_publisher（gui:=true のときはスライダーの付いた joint_state_publisher_gui）は、それを読んで、動く関節の角度を /joint_states に送る。robot_state_publisher は、関節の角度から各リンクの位置を計算して、/tf と /tf_static に送る。RViz2 は、/robot_description と /tf・/tf_static から、台車の形を描く">
<title>display.launch.py が起動するノードと、データの流れ。xacro が ackermann_car.urdf.xacro を展開した URDF の文字列を、robot_state_publisher がパラメータとして受け取る。robot_state_publisher は、/robot_description で URDF を配り、joint_state_publisher（gui:=true のときはスライダーの付いた joint_state_publisher_gui）は、それを読んで、動く関節の角度を /joint_states に送る。robot_state_publisher は、関節の角度から各リンクの位置を計算して、/tf と /tf_static に送る。RViz2 は、/robot_description と /tf・/tf_static から、台車の形を描く</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="1140" height="360" fill="#ffffff"/>
<g fill="#1a1a1a">
<path d="M260,75 L450,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M690,75 L880,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M530,230 L530,130" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M610,130 L610,230" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="20" width="240" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="450" y="20" width="240" height="110" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="880" y="20" width="240" height="110" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="450" y="230" width="240" height="110" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="140" y="59" text-anchor="middle" font-weight="bold">ackermann_car.urdf.xacro</text>
<text x="140" y="79" text-anchor="middle">台車の模型（自分で書く）</text>
<text x="140" y="99" text-anchor="middle">xacro で URDF に展開する</text>
<text x="570" y="59" text-anchor="middle" font-weight="bold">robot_state_publisher</text>
<text x="570" y="79" text-anchor="middle">関節の角度から</text>
<text x="570" y="99" text-anchor="middle">各リンクの位置を計算する</text>
<text x="1000" y="49" text-anchor="middle" font-weight="bold">RViz2</text>
<text x="1000" y="69" text-anchor="middle">台車の形と</text>
<text x="1000" y="89" text-anchor="middle">フレームの軸を描く</text>
<text x="1000" y="111" text-anchor="middle" fill="#9a3412" font-weight="bold">rviz:=true のとき</text>
<text x="570" y="269" text-anchor="middle" font-weight="bold">joint_state_publisher</text>
<text x="570" y="289" text-anchor="middle">動く関節の角度を送る</text>
<text x="570" y="309" text-anchor="middle">（gui:=true なら _gui）</text>
<text x="355" y="67" text-anchor="middle" font-size="13">URDF の文字列</text>
<text x="785" y="67" text-anchor="middle" font-size="13">/robot_description</text>
<text x="785" y="95" text-anchor="middle" font-size="13">/tf・/tf_static</text>
<text x="522" y="185" text-anchor="end" font-size="13">/joint_states</text>
<text x="618" y="185" text-anchor="start" font-size="13">/robot_description</text>
<rect x="20" y="257" width="20" height="14" rx="3" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="48" y="270">自分で書くファイル</text>
<rect x="20" y="292" width="20" height="14" rx="3" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="48" y="305">ROS 2 の既存のノード</text>
</g></svg>
