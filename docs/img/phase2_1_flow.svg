<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 400" width="1150" height="400" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="AckermannKinematics.compute の計算の流れ。前に進む速さ v と向きを変える速さ ω（フェーズ2-2では cmd_vel から受け取る）から、曲率 κ＝ω/v を求める（v が0なら κ を0にする）。κ を、最小の回転半径で決まる上限 ±κmax の中に切る。上限の中の κ から、アッカーマンの幾何で左右の舵の角度を、左右の車輪が走る円の半径から左右の後輪の回転の速さを求める。結果は、4つの指令と実際に出す ω を持つ DriveCommand として返す。フェーズ2-2では、ノードがこれを4つの指令のトピックに送り、Gazebo の台車を動かす">
<title>AckermannKinematics.compute の計算の流れ。前に進む速さ v と向きを変える速さ ω（フェーズ2-2では cmd_vel から受け取る）から、曲率 κ＝ω/v を求める（v が0なら κ を0にする）。κ を、最小の回転半径で決まる上限 ±κmax の中に切る。上限の中の κ から、アッカーマンの幾何で左右の舵の角度を、左右の車輪が走る円の半径から左右の後輪の回転の速さを求める。結果は、4つの指令と実際に出す ω を持つ DriveCommand として返す。フェーズ2-2では、ノードがこれを4つの指令のトピックに送り、Gazebo の台車を動かす</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="1150" height="400" fill="#ffffff"/>
<g fill="#1a1a1a">
<path d="M290,75 L440,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M710,75 L860,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M995,130 L995,230" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M860,285 L710,285" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M440,285 L290,285" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="20" width="270" height="110" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="440" y="20" width="270" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="860" y="20" width="270" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="860" y="230" width="270" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="440" y="230" width="270" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="20" y="230" width="270" height="110" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="155" y="59" text-anchor="middle" font-weight="bold">入力: v・ω</text>
<text x="155" y="79" text-anchor="middle">前に進む速さと</text>
<text x="155" y="99" text-anchor="middle">向きを変える速さ</text>
<text x="575" y="59" text-anchor="middle" font-weight="bold">曲率を求める</text>
<text x="575" y="79" text-anchor="middle">κ = ω / v</text>
<text x="575" y="99" text-anchor="middle">（v が0なら κ = 0）</text>
<text x="995" y="59" text-anchor="middle" font-weight="bold">上限で切る</text>
<text x="995" y="79" text-anchor="middle">−κmax ≦ κ ≦ κmax</text>
<text x="995" y="99" text-anchor="middle">（κmax = 1 / 最小の回転半径）</text>
<text x="995" y="269" text-anchor="middle" font-weight="bold">関節の値を求める</text>
<text x="995" y="289" text-anchor="middle">左右の舵の角度（アッカーマン）</text>
<text x="995" y="309" text-anchor="middle">左右の後輪の回転の速さ</text>
<text x="575" y="269" text-anchor="middle" font-weight="bold">DriveCommand を返す</text>
<text x="575" y="289" text-anchor="middle">4つの指令と、</text>
<text x="575" y="309" text-anchor="middle">実際に出す ω</text>
<text x="155" y="269" text-anchor="middle" font-weight="bold">フェーズ2-2のノード</text>
<text x="155" y="289" text-anchor="middle">4つの指令のトピックへ送り、</text>
<text x="155" y="309" text-anchor="middle">Gazebo の台車を動かす</text>
<text x="365" y="67" text-anchor="middle" font-size="13">v・ω</text>
<text x="785" y="67" text-anchor="middle" font-size="13">κ</text>
<text x="1003" y="185" text-anchor="start" font-size="13">上限の中の κ</text>
<text x="785" y="277" text-anchor="middle" font-size="13">4つの値</text>
<text x="365" y="277" text-anchor="middle" font-size="13">DriveCommand</text>
<rect x="20" y="357" width="20" height="14" rx="3" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="48" y="370">入力（フェーズ2-2では cmd_vel から受け取る）</text>
<rect x="500" y="357" width="20" height="14" rx="3" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="528" y="370">このページで書くクラスの中の計算</text>
<rect x="960" y="357" width="20" height="14" rx="3" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="988" y="370">フェーズ2-2で作る部分</text>
</g></svg>
