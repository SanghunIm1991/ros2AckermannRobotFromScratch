<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 470" width="1230" height="470" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="フェーズ4-2で動かすものと、トピックの流れ。T1 の Gazebo は、部屋の中で台車を動かし、LiDAR の距離と台車の真の位置を出す。T1 の ros_gz_bridge が、それを /scan と /ground_truth/odom として ROS 2 へ中継する。T4 の obstacle_avoider（このページで書くノード）は、/scan の正面と後ろの距離から、直進・停止・後退・前進の切り返しを決め、/cmd_vel を送る。T2 の ackermann_drive（フェーズ2-2）は、/cmd_vel を舵の角度と後輪の速さの指令に直し、中継を通して Gazebo へ送る。T3 の clearance_meter（このページで書くノード）は、真の位置から、台車の外形と部屋の壁の隙間を表示する">
<title>フェーズ4-2で動かすものと、トピックの流れ。T1 の Gazebo は、部屋の中で台車を動かし、LiDAR の距離と台車の真の位置を出す。T1 の ros_gz_bridge が、それを /scan と /ground_truth/odom として ROS 2 へ中継する。T4 の obstacle_avoider（このページで書くノード）は、/scan の正面と後ろの距離から、直進・停止・後退・前進の切り返しを決め、/cmd_vel を送る。T2 の ackermann_drive（フェーズ2-2）は、/cmd_vel を舵の角度と後輪の速さの指令に直し、中継を通して Gazebo へ送る。T3 の clearance_meter（このページで書くノード）は、真の位置から、台車の外形と部屋の壁の隙間を表示する</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker><marker id="s" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#333333"/></marker></defs>
<rect x="0" y="0" width="1230" height="470" fill="#ffffff"/>
<g fill="#1a1a1a">
<path d="M290,75 L480,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#s)"/>
<path d="M750,75 L940,75" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1075,130 L1075,240" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M940,295 L690,295 L690,130" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M540,130 L540,295 L290,295" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="20" y="20" width="270" height="110" rx="8" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<rect x="480" y="20" width="270" height="110" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="940" y="20" width="270" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="20" y="240" width="270" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="940" y="240" width="270" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="155" y="59" text-anchor="middle" font-weight="bold">Gazebo（T1）</text>
<text x="155" y="79" text-anchor="middle">部屋の中で台車を動かし、</text>
<text x="155" y="99" text-anchor="middle">LiDAR の距離を計算する</text>
<text x="615" y="59" text-anchor="middle" font-weight="bold">ros_gz_bridge（T1）</text>
<text x="615" y="79" text-anchor="middle">Gazebo と ROS 2 の間で</text>
<text x="615" y="99" text-anchor="middle">トピックを中継する</text>
<text x="1075" y="59" text-anchor="middle" font-weight="bold">obstacle_avoider（T4）</text>
<text x="1075" y="79" text-anchor="middle">正面と後ろの距離から</text>
<text x="1075" y="99" text-anchor="middle">止まる・切り返すを決める</text>
<text x="155" y="279" text-anchor="middle" font-weight="bold">clearance_meter（T3）</text>
<text x="155" y="299" text-anchor="middle">台車の外形と壁の</text>
<text x="155" y="319" text-anchor="middle">隙間を表示する</text>
<text x="1075" y="279" text-anchor="middle" font-weight="bold">ackermann_drive（T2）</text>
<text x="1075" y="299" text-anchor="middle">cmd_vel を、舵と後輪の</text>
<text x="1075" y="319" text-anchor="middle">指令に直す（フェーズ2-2）</text>
<text x="385" y="67" text-anchor="middle" font-size="13">センサの値・指令</text>
<text x="845" y="67" text-anchor="middle" font-size="13">/scan</text>
<text x="1085" y="190" text-anchor="start" font-size="13">/cmd_vel</text>
<text x="815" y="287" text-anchor="middle" font-size="13">舵と後輪の指令</text>
<text x="415" y="287" text-anchor="middle" font-size="13">/ground_truth/odom</text>
<rect x="40" y="377" width="20" height="14" rx="3" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<text x="68" y="390">自作のノード</text>
<rect x="500" y="377" width="20" height="14" rx="3" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="528" y="390">ROS 2 のノード</text>
<rect x="960" y="377" width="20" height="14" rx="3" fill="#eef7ee" stroke="#3a8a3a" stroke-width="1.5"/>
<text x="988" y="390">Gazebo（シミュレータ）</text>
</g></svg>
