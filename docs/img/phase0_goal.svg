<rect x="20" y="360" width="230" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="430" y="360" width="230" height="110" rx="8" fill="#fff4e5" stroke="#c77d1a" stroke-width="1.5"/>
<rect x="840" y="360" width="230" height="110" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<rect x="20" y="530" width="1050" height="110" rx="8" fill="#f3eefa" stroke="#7a5aa6" stroke-width="1.5"/>
<text x="545" y="49" text-anchor="middle" font-weight="bold">Gazebo</text>
<text x="545" y="69" text-anchor="middle">台車の物理と</text>
<text x="545" y="89" text-anchor="middle">LiDARを計算する</text>
<text x="545" y="111" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ1-2・4-1</text>
<text x="545" y="219" text-anchor="middle" font-weight="bold">ros_gz_bridge</text>
<text x="545" y="239" text-anchor="middle">GazeboとROS 2の</text>
<text x="545" y="259" text-anchor="middle">間で値を中継する</text>
<text x="545" y="281" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ1-2・4-1</text>
<text x="135" y="389" text-anchor="middle" font-weight="bold">駆動のノード</text>
<text x="135" y="409" text-anchor="middle">cmd_velを舵の角度と</text>
<text x="135" y="429" text-anchor="middle">後輪の速さに直す</text>
<text x="135" y="451" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ2</text>
<text x="545" y="389" text-anchor="middle" font-weight="bold">オドメトリのノード</text>
<text x="545" y="409" text-anchor="middle">関節の状態から</text>
<text x="545" y="429" text-anchor="middle">位置と向きを積算する</text>
<text x="545" y="451" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ3</text>
<text x="955" y="389" text-anchor="middle" font-weight="bold">SLAM・位置推定</text>
<text x="955" y="409" text-anchor="middle">LiDARの値から地図を</text>
<text x="955" y="429" text-anchor="middle">作り、自己位置を直す</text>
<text x="955" y="451" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ5・6-1</text>
<text x="545" y="569" text-anchor="middle" font-weight="bold">Nav2</text>
<text x="545" y="589" text-anchor="middle">地図の上で経路を計画し、cmd_velを出して追従する</text>
<text x="545" y="611" text-anchor="middle" fill="#9a3412" font-weight="bold">フェーズ6</text>
<text x="553" y="165" text-anchor="start" font-size="13">Gazeboのトピック</text>
