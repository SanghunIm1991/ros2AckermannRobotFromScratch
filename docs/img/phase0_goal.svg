<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 660" width="1090" height="660" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="この教材の完成形（フェーズ6）の構成。Gazebo（フェーズ1-2・4-1）が台車の物理とLiDARを計算し、ros_gz_bridge（フェーズ1-2・4-1）がGazeboとROS 2の間で値を中継する。Nav2（フェーズ6）が地図の上で経路を計画し、cmd_velを駆動のノード（フェーズ2）へ送る。駆動のノードは、cmd_velを舵の角度と後輪の速さの指令に直して、ros_gz_bridgeを通してGazeboへ送る。オドメトリのノード（フェーズ3）は、関節の状態から位置と向きを積算し、オドメトリをNav2へ、TF（odom→base_footprint）をSLAMへ渡す。SLAM・位置推定（フェーズ5・6-1）は、LiDARの値とオドメトリから地図を作り（フェーズ6では、地図の上の位置を推定し）、地図とTF（map→odom）をNav2へ渡す。駆動とオドメトリのノードは自作し、SLAM・位置推定とNav2は既存のパッケージを設定して使う。Gazeboが受け持つ部分は、実機では本物の台車とセンサに入れ替わる">
<title>この教材の完成形（フェーズ6）の構成。Gazebo（フェーズ1-2・4-1）が台車の物理とLiDARを計算し、ros_gz_bridge（フェーズ1-2・4-1）がGazeboとROS 2の間で値を中継する。Nav2（フェーズ6）が地図の上で経路を計画し、cmd_velを駆動のノード（フェーズ2）へ送る。駆動のノードは、cmd_velを舵の角度と後輪の速さの指令に直して、ros_gz_bridgeを通してGazeboへ送る。オドメトリのノード（フェーズ3）は、関節の状態から位置と向きを積算し、オドメトリをNav2へ、TF（odom→base_footprint）をSLAMへ渡す。SLAM・位置推定（フェーズ5・6-1）は、LiDARの値とオドメトリから地図を作り（フェーズ6では、地図の上の位置を推定し）、地図とTF（map→odom）をNav2へ渡す。駆動とオドメトリのノードは自作し、SLAM・位置推定とNav2は既存のパッケージを設定して使う。Gazeboが受け持つ部分は、実機では本物の台車とセンサに入れ替わる</title>
