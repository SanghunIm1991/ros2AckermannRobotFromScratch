<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="'Noto Sans CJK JP','Noto Sans JP','Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="14" role="img" aria-label="左へ曲がる台車を上から見た図。前は図の上。後車軸を左へ延ばした線の上に、回転の中心がある。左右の前輪は、それぞれの車輪の向きに直角な線が回転の中心を通るように舵を切る。内側（左）の前輪は大きく、外側（右）の前輪は小さく切る。回転の中心から後車軸の中心までの距離が回転の半径 R。前車軸と後車軸の間の距離がホイールベース L、左右の車輪の間の距離がトレッド W">
<title>左へ曲がる台車を上から見た図。前は図の上。後車軸を左へ延ばした線の上に、回転の中心がある。左右の前輪は、それぞれの車輪の向きに直角な線が回転の中心を通るように舵を切る。内側（左）の前輪は大きく、外側（右）の前輪は小さく切る。回転の中心から後車軸の中心までの距離が回転の半径 R。前車軸と後車軸の間の距離がホイールベース L、左右の車輪の間の距離がトレッド W</title>
