<line x1="310" y1="356" x2="310" y2="380" stroke="#999999" stroke-width="1"/>
<text x="310" y="150" text-anchor="middle" font-weight="bold">前</text>
<text x="410" y="295" text-anchor="start">ホイールベース L</text>
<text x="310" y="457" text-anchor="middle">トレッド W</text>
<text x="250" y="180" text-anchor="end" font-weight="bold">左の前輪（内側）</text>
<text x="250" y="200" text-anchor="end">舵を大きく切る</text>
<text x="370" y="180" text-anchor="start" font-weight="bold">右の前輪（外側）</text>
<text x="370" y="200" text-anchor="start">舵を小さく切る</text>
<text x="180" y="392" text-anchor="middle">回転の半径 R（後車軸の中心まで）</text>
<text x="40" y="414" text-anchor="start" font-weight="bold">回転の中心</text>
<text x="20" y="30" text-anchor="start" font-weight="bold">上から見た台車（左へ曲がるとき）</text>
<text x="20" y="502" text-anchor="start">各車輪の向きに直角な線と、後車軸を延ばした線が、1点（回転の中心）で交わる</text>
